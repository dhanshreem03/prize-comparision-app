<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price Comparison App</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}

header{
    background:#2196F3;
    color:white;
    text-align:center;
    padding:18px;
    font-size:24px;
    font-weight:bold;
}

.container{
    padding:20px;
}

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.search-box input{
    flex:1;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

.search-box button{
    background:#2196F3;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
}

.categories{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.card{
    background:white;
    padding:20px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    font-size:18px;
}
</style>
</head>

<body>

<header>
Price Comparison App
</header>

<div class="container">

<div class="search-box">
<input type="text" placeholder="Search Product...">
<button>Search</button>
</div>

<h2>Categories</h2>

<div class="categories">
<div class="card">📱 Electronics</div>
<div class="card">👕 Fashion</div>
<div class="card">🏠 Home</div>
<div class="card">🛒 Grocery</div>
<div class="card">💄 Beauty</div>
<div class="card">📚 Books</div>
</div>

</div>

</body>
</html>
