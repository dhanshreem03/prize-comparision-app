<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:linear-gradient(180deg,#6f7cff,#7d3cff);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .register-card{
            width:420px;
            background:#fff;
            border-radius:15px;
            padding:30px;
            box-shadow:0 10px 30px rgba(0,0,0,.2);
        }

        .logo{
            width:70px;
            height:70px;
            background:#eef3ff;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            margin:auto;
            color:#4f46e5;
            font-size:28px;
        }

        h2{
            text-align:center;
            margin-top:15px;
            font-weight:700;
        }

        p{
            text-align:center;
            color:#777;
            margin-bottom:25px;
        }

        .input-group-text{
            background:#fff;
        }

        .btn-primary{
            width:100%;
            border-radius:8px;
            padding:10px;
        }

        .login-btn{
            width:100%;
            border:1px solid #0d6efd;
            color:#0d6efd;
            margin-top:15px;
        }

        .terms{
            font-size:13px;
        }
    </style>
</head>
<body>

<div class="register-card">

    <div class="logo">
        
        <img src="./static/asset/logo.png" width="200px">
    </div>

    <h2>Create Your Account</h2>

    <p>Join MyAdvocate and start serving today!</p>

    <form>

        <label class="form-label">Username</label>
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="fa fa-user"></i></span>
            <input type="text" class="form-control" placeholder="Choose a username">
        </div>

        <label class="form-label">Email</label>
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="fa fa-envelope"></i></span>
            <input type="email" class="form-control" placeholder="Enter your email">
        </div>

        <label class="form-label">Password</label>
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="fa fa-lock"></i></span>
            <input type="password" class="form-control" placeholder="Create password">
            <span class="input-group-text"><i class="fa fa-eye"></i></span>
        </div>

        <label class="form-label">Confirm Password</label>
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="fa fa-lock"></i></span>
            <input type="password" class="form-control" placeholder="Confirm password">
            <span class="input-group-text"><i class="fa fa-eye"></i></span>
        </div>

        <label class="form-label">Mobile Number</label>
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="fa fa-phone"></i></span>
            <input type="text" class="form-control" placeholder="Enter mobile number">
        </div>

        <label class="form-label">Address</label>
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="fa fa-location-dot"></i></span>
            <input type="text" class="form-control" placeholder="Enter address">
        </div>

        <label class="form-label">Profile Picture</label>
        <input type="file" class="form-control mb-3">

        <div class="form-check mb-3 terms">
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">
                I agree to the Terms of Service and Privacy Policy
            </label>
        </div>

        <button class="btn btn-primary">
            <i class="fa fa-user-plus"></i> Create Account
        </button>

        <button type="button" class="btn login-btn">
            <i class="fa fa-sign-in-alt"></i> Login
        </button>

    </form>

</div>

</body>
</html>
