<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Prize Comparison</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(180deg, #6f7cff, #7d3cff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-card {
            width: 450px;
            background: #fff;
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .2);
        }

        .logo {
            width: 80px;
            height: 80px;
            background: #eef3ff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            overflow: hidden;
        }

        h2 {
            text-align: center;
            margin-top: 15px;
            font-weight: 700;
        }

        p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .input-group-text {
            background: #fff;
        }

        .btn-primary {
            width: 100%;
            border-radius: 8px;
            padding: 10px;
        }

        .login-btn {
            width: 100%;
            border: 1px solid #0d6efd;
            color: #0d6efd;
            margin-top: 15px;
            border-radius: 8px;
            padding: 10px;
            background: #fff;
            font-weight: 600;
        }

        .login-btn:hover {
            background: #0d6efd;
            color: #fff;
        }

        .divider {
            text-align: center;
            position: relative;
            margin: 20px 0;
            color: #aaa;
            font-size: 13px;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: #fff;
            padding: 0 12px;
            position: relative;
        }

        .alert {
            font-size: 14px;
        }

        .toggle-password {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="register-card">

        <div class="logo">
            <img src="/static/asset/logo.png" width="70px" height="70px" style="object-fit:cover;border-radius:50%;"
                onerror="this.style.display='none';this.parentElement.innerHTML='<i class=\'fa fa-chart-line\' style=\'color:#4f46e5;font-size:28px;\'></i>'">
        </div>

        <h2>Create Account</h2>
        <p>Sign up to start comparing prices</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category == 'error' else 'success' if category == 'success' else 'info' }} alert-dismissible"
            role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}">

            <label class="form-label fw-semibold">Username</label>
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fa fa-user"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Choose a username" required
                    minlength="3">
            </div>

            <label class="form-label fw-semibold">Email</label>
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>

            <label class="form-label fw-semibold">Password</label>
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fa fa-lock"></i></span>
                <input type="password" name="password" id="reg_password" class="form-control"
                    placeholder="Create password (min 6 chars)" required minlength="6">
                <span class="input-group-text toggle-password" onclick="togglePassword('reg_password', this)"><i
                        class="fa fa-eye"></i></span>
            </div>

            <label class="form-label fw-semibold">Confirm Password</label>
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fa fa-lock"></i></span>
                <input type="password" name="confirm_password" id="reg_confirm" class="form-control"
                    placeholder="Re-enter password" required minlength="6">
                <span class="input-group-text toggle-password" onclick="togglePassword('reg_confirm', this)"><i
                        class="fa fa-eye"></i></span>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fa fa-user-plus"></i> Create Account
            </button>

        </form>

        <div class="divider"><span>Already have an account?</span></div>

        <a href="{{ url_for('login') }}" class="login-btn d-block text-center text-decoration-none">
            <i class="fa fa-sign-in-alt"></i> Login to Account
        </a>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            const i = icon.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                i.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                i.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>

</html>
