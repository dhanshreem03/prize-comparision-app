<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prize Comparison App - Compare Prices Across Platforms</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px;
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .header h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-box button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .search-box button:active {
            transform: translateY(0);
        }

        .results-container {
            margin-top: 30px;
            max-height: 500px;
            overflow-y: auto;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .product-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            transition: box-shadow 0.3s;
        }

        .product-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .product-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 5px;
            background: #f0f0f0;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .product-source {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .price-info {
            display: flex;
            gap: 15px;
            margin-top: 8px;
        }

        .price {
            font-size: 14px;
        }

        .price.original {
            color: #999;
            text-decoration: line-through;
        }

        .price.discounted {
            color: #e74c3c;
            font-weight: 600;
            font-size: 16px;
        }

        .error {
            background: #ffe6e6;
            color: #c33;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #ddd;
        }

        .feature {
            text-align: center;
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .feature-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .feature-desc {
            font-size: 13px;
            color: #666;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 24px;
            }

            .search-box {
                flex-direction: column;
            }

            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo">💰</div>
            <h1>Prize Comparison</h1>
            <p>Find the best deals across multiple platforms</p>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput"
                placeholder="Search for a product... (e.g., iPhone 16, Laptop, Headphones)" autocomplete="off" />
            <button onclick="searchProducts()">Search</button>
        </div>

        <div class="error" id="errorMessage"></div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #667eea;">Searching across platforms...</p>
        </div>

        <div class="results-container" id="resultsContainer"></div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">🔍</div>
                <div class="feature-title">Multi-Platform</div>
                <div class="feature-desc">Search Amazon & Flipkart</div>
            </div>
            <div class="feature">
                <div class="feature-icon">💵</div>
                <div class="feature-title">Best Prices</div>
                <div class="feature-desc">Compare prices instantly</div>
            </div>
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-title">Fast</div>
                <div class="feature-desc">Real-time scraping</div>
            </div>
            <div class="feature">
                <div class="feature-icon">💾</div>
                <div class="feature-title">Save</div>
                <div class="feature-desc">Store search results</div>
            </div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.querySelector('button');

        // Allow Enter key to search
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchProducts();
            }
        });

        async function searchProducts() {
            const productName = searchInput.value.trim();

            if (!productName) {
                showError('Please enter a product name');
                return;
            }

            clearError();
            showLoading(true);
            document.getElementById('resultsContainer').innerHTML = '';

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ product_name: productName })
                });

                const data = await response.json();
                showLoading(false);

                if (!response.ok) {
                    showError(data.error || 'Search failed');
                    return;
                }

                if (data.results.length === 0) {
                    showError('No products found. Please try another search.');
                    return;
                }

                displayResults(data.results);
            } catch (error) {
                showLoading(false);
                showError('Error searching products: ' + error.message);
                console.error('Search error:', error);
            }
        }

        function displayResults(results) {
            const container = document.getElementById('resultsContainer');

            const grouped = {};
            results.forEach(product => {
                if (!grouped[product.product_name]) {
                    grouped[product.product_name] = [];
                }
                grouped[product.product_name].push(product);
            });

            let html = '';
            for (const [productName, items] of Object.entries(grouped)) {
                items.forEach(product => {
                    html += `
                        <div class="product-card">
                            ${product.image_url ? `<img src="${product.image_url}" alt="${productName}" class="product-image" onerror="this.src='https://via.placeholder.com/80'">` : '<div class="product-image" style="background: #f0f0f0;"></div>'}
                            <div class="product-info">
                                <div class="product-name">${productName}</div>
                                <span class="product-source">${product.source}</span>
                                <div class="price-info">
                                    ${product.price ? `<div class="price original">₹${product.price}</div>` : ''}
                                    ${product.discounted_price ? `<div class="price discounted">₹${product.discounted_price}</div>` : ''}
                                </div>
                                ${product.product_url ? `<a href="${product.product_url}" target="_blank" style="display: inline-block; margin-top: 8px; color: #667eea; text-decoration: none; font-size: 13px;">View on ${product.source} →</a>` : ''}
                            </div>
                        </div>
                    `;
                });
            }

            container.innerHTML = html;
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.classList.add('show');
        }

        function clearError() {
            const errorElement = document.getElementById('errorMessage');
            errorElement.classList.remove('show');
            errorElement.textContent = '';
        }
    </script>
</body>

</html>
